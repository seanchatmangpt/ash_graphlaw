#
# UNSUPPORTED(generator-capability): hand-written; no pack emits a CI workflow.
#
# Projection court. Proves that the COMMITTED generated files equal a fresh
# `ggen sync run` of the committed sources (ontology.ttl, queries/, templates/,
# gates/, ggen.toml) under the pinned ggen and ggen-marketplace identities.
# ontology.ttl is the single source of the pins; the env values below must equal it.
# The sync is scripts/ggen_sync.sh: it vendors nothing itself, refuses a vendored marketplace whose
# recorded sha differs from ontology.ttl, runs `ggen sync run`, prunes the pack's reference-spec
# projections and formats. This workflow never adds, commits, or pushes.
name: Manufacture

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only a superseded PR head is cancelled; main and dispatch runs are never cancelled, so every main
# head keeps its exact-head receipt.
concurrency:
  group: manufacture-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manufacture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GGEN_SHA: ff96f04e8c7b851e5cca53f3faf5ce1d5f43ce6e
      MARKETPLACE_SHA: caa4fe6133445638cbfdbfac017187ed8090dc95
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Checkout candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Exact-subject admission
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          echo "subject expected=${SUBJECT_SHA} actual=${actual}"
          test "${actual}" = "${SUBJECT_SHA}"
          mkdir -p tmp/receipts
          printf '%s\n' "${actual}" > tmp/receipts/subject.sha

      - name: Assert ontology.ttl is the single source of pins
        shell: bash
        run: |
          set -euo pipefail
          read_pin() {
            grep -E "glx:$1[[:space:]]+\"[0-9a-f]{40}\"" ontology.ttl \
              | sed -E "s/.*glx:$1[[:space:]]+\"([0-9a-f]{40})\".*/\1/" | sort -u
          }
          onto_ggen="$(read_pin ggenSha)"
          onto_market="$(read_pin marketplaceSha)"
          echo "ontology ggenSha=${onto_ggen} workflow GGEN_SHA=${GGEN_SHA}"
          echo "ontology marketplaceSha=${onto_market} workflow MARKETPLACE_SHA=${MARKETPLACE_SHA}"
          test "$(printf '%s\n' "${onto_ggen}" | wc -l)" -eq 1
          test "$(printf '%s\n' "${onto_market}" | wc -l)" -eq 1
          test "${onto_ggen}" = "${GGEN_SHA}"
          test "${onto_market}" = "${MARKETPLACE_SHA}"

      - name: Checkout pinned ggen source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: seanchatmangpt/ggen
          ref: ${{ env.GGEN_SHA }}
          path: vendor/ggen
          persist-credentials: false

      - name: Checkout pinned marketplace (source of the archive)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: seanchatmangpt/ggen-marketplace
          ref: ${{ env.MARKETPLACE_SHA }}
          path: marketplace-src
          persist-credentials: false

      - name: Materialize the pack with git archive at the pinned sha
        shell: bash
        run: |
          set -euo pipefail
          GGEN_MARKETPLACE_REPO="${PWD}/marketplace-src" scripts/vendor_marketplace.sh
          test "$(cat vendor/ggen-marketplace/.pin)" = "${MARKETPLACE_SHA}"

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - run: mix deps.get --check-locked

      - name: Build pinned ggen from Rust source
        shell: bash
        env:
          RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev llvm-dev
          rustup toolchain install nightly-2026-06-22 --profile minimal --component rustfmt --component clippy
          rustup override set nightly-2026-06-22
          cargo build --release --locked --manifest-path vendor/ggen/crates/ggen-cli/Cargo.toml --bin ggen
          mkdir -p .bin
          cp vendor/ggen/target/release/ggen .bin/ggen
          echo "${PWD}/.bin" >> "${GITHUB_PATH}"
          .bin/ggen --version

      - name: Gates via ggen dry-run validation
        shell: bash
        run: |
          set -euo pipefail
          for gate in gates/010_project_contract.rq gates/020_refusal_code_contract.rq \
                      gates/030_standing_contract.rq gates/040_admission_vocab_contract.rq \
                      gates/050_wasi_import_contract.rq; do
            test -s "${gate}"
          done
          # strict_mode + [validation] gates in ggen.toml run inside the dry-run.
          .bin/ggen sync run --dry-run --format json > tmp/receipts/dry-run.json
          test -s tmp/receipts/dry-run.json

      - name: Manufacture twice and require byte-identical output
        shell: bash
        run: |
          set -euo pipefail
          manifest() {
            # ggen-projected file set (local template rules + ash-extension-pack outputs)
            for f in mix.exs .formatter.exs .gitignore README.md LICENSE \
                     lib/ash_graphlaw.ex lib/ash_graphlaw/abi.ex lib/ash_graphlaw/receipt.ex \
                     lib/ash_graphlaw/admitted.ex lib/ash_graphlaw/standing.ex lib/ash_graphlaw/refusal.ex \
                     lib/ash_graphlaw/resource.ex lib/ash_graphlaw/persist.ex lib/ash_graphlaw/verify.ex \
                     lib/ash_graphlaw/info.ex lib/mix/tasks/ash_graphlaw.install.ex \
                     documentation/reference/typed_refusals.md priv/graphlaw/MANIFEST.json \
                     test/test_helper.exs test/ash_graphlaw_composition_test.exs; do
              test -f "${f}" || { echo "missing generated file: ${f}" >&2; exit 1; }
              sha256sum "${f}"
            done
          }
          scripts/ggen_sync.sh
          manifest > tmp/receipts/generated.run1.sha256
          scripts/ggen_sync.sh
          manifest > tmp/receipts/generated.run2.sha256
          diff -u tmp/receipts/generated.run1.sha256 tmp/receipts/generated.run2.sha256
          cmp tmp/receipts/generated.run1.sha256 tmp/receipts/generated.run2.sha256
          wc -l tmp/receipts/generated.run1.sha256

      - name: Projection court (committed generated files equal fresh regeneration)
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- . ':!vendor' ':!marketplace-src' ':!.bin' ':!tmp'; then
            echo "::error::committed generated files differ from a fresh ggen regeneration" >&2
            exit 1
          fi
          # Untracked generated output means a projection was never committed.
          untracked="$(git ls-files --others --exclude-standard -- . ':!vendor' ':!marketplace-src' ':!.bin' ':!tmp' ':!.ggen-v2')"
          if [ -n "${untracked}" ]; then
            echo "::error::regeneration produced uncommitted files:" >&2
            printf '%s\n' "${untracked}" >&2
            exit 1
          fi

      - name: Receipt history
        shell: bash
        run: |
          set -euo pipefail
          .bin/ggen receipt history | tee tmp/receipts/receipt-history.txt
          if [ -f .ggen-v2/receipt-log.jsonl ]; then
            cp .ggen-v2/receipt-log.jsonl tmp/receipts/receipt-log.jsonl
          fi

      - name: Upload manufacture receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manufacture-receipts
          path: |
            tmp/receipts/
            .ggen-v2/receipt-log.jsonl
          if-no-files-found: error
