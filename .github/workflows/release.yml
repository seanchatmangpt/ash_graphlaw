# Release to Hex. Re-runs EVERY CI gate (supply-chain, quality incl. credo --strict and dialyzer,
# test, mutation court) on the exact tag subject, then publishes ONLY when a HEX_API_KEY secret is
# configured. The release gate is never weaker than the CI gate.
# workflow_dispatch is admitted only from main or a v* tag, runs `mix hex.publish --dry-run` and
# never publishes. The tag/version identity is refused in the job that publishes, not only earlier.
# No credential value appears in this file.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ref-court:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Admit only main or a v* tag
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/main | refs/tags/v*) echo "ref admitted: $GITHUB_REF" ;;
            *) echo "REFUSED(ref:$GITHUB_REF is neither main nor a v* tag)" >&2; exit 2 ;;
          esac

  supply-chain:
    needs: ref-court
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit exact subject
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - name: Refuse mix.lock drift
        run: mix deps.get --check-locked
      - name: Refuse retired / security-advisory Hex packages
        run: mix hex.audit
      - name: Audit dependencies against advisories (mix_audit)
        run: mix deps.audit
      - name: Verify mix.lock unchanged
        run: git diff --exit-code -- mix.lock
      - name: Package closure ships MANIFEST.json and no wasm binary
        run: |
          set -euo pipefail
          pkg="$RUNNER_TEMP/pkg"
          rm -rf "$pkg"
          mix hex.build --unpack -o "$pkg"
          test -f "$pkg/priv/graphlaw/MANIFEST.json" || { echo "REFUSED(package:missing priv/graphlaw/MANIFEST.json)" >&2; exit 2; }
          if find "$pkg" -name '*.wasm' | grep -q .; then
            echo "REFUSED(package:ships a wasm binary)" >&2
            find "$pkg" -name '*.wasm' >&2
            exit 2
          fi

  quality:
    needs: ref-court
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit exact subject
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ash-graphlaw-v1-${{ runner.os }}-quality-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            ash-graphlaw-v1-${{ runner.os }}-quality-${{ hashFiles('.tool-versions', 'mix.lock') }}-
            ash-graphlaw-v1-${{ runner.os }}-quality-
      - run: mix deps.get
      - run: mix format --check-formatted
      - id: compile
        run: mix compile --warnings-as-errors
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        with:
          path: |
            deps
            _build
          key: ash-graphlaw-v1-${{ runner.os }}-quality-${{ hashFiles('.tool-versions', 'mix.lock') }}-${{ github.run_id }}
      - run: mix credo --strict
      - run: mix sobelow --skip
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: priv/plts
          key: ash-graphlaw-plt-v1-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            ash-graphlaw-plt-v1-${{ runner.os }}-
      - id: plt
        name: Build dialyzer PLT
        run: mix dialyzer --plt
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.plt.outcome == 'success' }}
        with:
          path: priv/plts
          key: ash-graphlaw-plt-v1-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}-${{ github.run_id }}
      - run: mix dialyzer
      - run: mix hex.build

  test:
    needs: supply-chain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit exact subject
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - name: Refuse tag/version identity mismatch
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/.*@version "\([^"]*\)".*/\1/p' mix.exs | head -n 1)"
          test -n "$project_version"
          test "$GITHUB_REF_NAME" = "v$project_version"
      - run: mix deps.get --check-locked
      - run: mix compile --force --warnings-as-errors
      - name: Vendor pinned graphlaw.wasm and verify its digest
        run: |
          set -euo pipefail
          url="$(python3 -c 'import json; print(json.load(open("priv/graphlaw/MANIFEST.json"))["artifact"]["url"])')"
          sha="$(python3 -c 'import json; print(json.load(open("priv/graphlaw/MANIFEST.json"))["artifact"]["sha256"])')"
          mkdir -p priv/graphlaw
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output priv/graphlaw/graphlaw.wasm "$url"
          echo "$sha  priv/graphlaw/graphlaw.wasm" | sha256sum --check --strict -
      - run: mix test --cover
      - run: mix ash_graphlaw.verify

  mutation:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: false
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit exact subject
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            deps
            _build
          key: ash-graphlaw-v1-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            ash-graphlaw-v1-${{ runner.os }}-test-${{ hashFiles('.tool-versions', 'mix.lock') }}-
            ash-graphlaw-v1-${{ runner.os }}-test-
      - run: mix deps.get --check-locked
      - id: compile
        run: mix compile --warnings-as-errors
      - name: Vendor pinned graphlaw.wasm and verify its digest
        run: |
          set -euo pipefail
          url="$(python3 -c 'import json; print(json.load(open("priv/graphlaw/MANIFEST.json"))["artifact"]["url"])')"
          sha="$(python3 -c 'import json; print(json.load(open("priv/graphlaw/MANIFEST.json"))["artifact"]["sha256"])')"
          mkdir -p priv/graphlaw
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output priv/graphlaw/graphlaw.wasm "$url"
          echo "$sha  priv/graphlaw/graphlaw.wasm" | sha256sum --check --strict -
      - name: Mutation court (every mutant must be killed)
        run: mix ash_graphlaw.mutate --require-killed --evidence-dir mutation
      - name: Preserve mutation report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-mutation-${{ github.sha }}
          path: mutation/
          if-no-files-found: warn

  publish:
    needs: [ref-court, supply-chain, quality, test, mutation]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MIX_ENV: dev
      # The secrets context is unavailable in step `if:`; expose it via env and
      # gate on env.HEX_API_KEY != '' (equivalent to secrets.HEX_API_KEY != '').
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Admit exact subject
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict
      - run: mix local.hex --force
      - run: mix local.rebar --force
      - name: Refuse tag/version identity mismatch (in the job that publishes)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          project_version="$(sed -n 's/.*@version "\([^"]*\)".*/\1/p' mix.exs | head -n 1)"
          test -n "$project_version"
          test "$GITHUB_REF_NAME" = "v$project_version"
      - run: mix deps.get
      - run: mix hex.build
      - name: Hex publish dry run
        if: github.event_name == 'workflow_dispatch'
        run: mix hex.publish --dry-run
      - name: Publish to Hex.pm
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && env.HEX_API_KEY != ''
        run: mix hex.publish --yes
